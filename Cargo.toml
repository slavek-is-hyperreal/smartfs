[workspace]
resolver = "2"
members = [
    "crates/smartfs-schema",
    "crates/smartfs-store",
    "crates/smartfs-compress",
    "crates/smartfs-ipfs",
    "crates/smartfs-db",
    "crates/smartfs-ai",
    "crates/smartfs-semantic",
    "crates/smartfs-fuse",
    "crates/smartfs-mcp",
    "crates/smartfs-cli",
    "crates/smartfs-docgen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SmartFS Authors"]
license = "Apache-2.0"

[workspace.dependencies]
smartfs-schema = { path = "crates/smartfs-schema" }
smartfs-store = { path = "crates/smartfs-store" }
smartfs-compress = { path = "crates/smartfs-compress" }
smartfs-ipfs = { path = "crates/smartfs-ipfs" }
smartfs-db = { path = "crates/smartfs-db" }
smartfs-ai = { path = "crates/smartfs-ai" }
smartfs-semantic = { path = "crates/smartfs-semantic" }
smartfs-fuse = { path = "crates/smartfs-fuse" }
smartfs-mcp = { path = "crates/smartfs-mcp" }
smartfs-cli = { path = "crates/smartfs-cli" }
smartfs-docgen = { path = "crates/smartfs-docgen" }
fuser = "0.15"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart"] }
thiserror = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
sha2 = "0.10"
zstd = "0.13"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
regex = "1.11"
