[workspace]
resolver = "2"
members = [
    "crates/smartfs-schema",
    "crates/smartfs-store",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SmartFS Authors"]
license = "Apache-2.0"

[workspace.dependencies]
smartfs-schema = { path = "crates/smartfs-schema" }
smartfs-store = { path = "crates/smartfs-store" }
thiserror = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
sha2 = "0.10"
zstd = "0.13"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
