[package]
name = "smartfs-compress"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Streaming hash and zstd compression pipeline for SmartFS"

[dependencies]
smartfs-schema.workspace = true
smartfs-store.workspace = true
sha2.workspace = true
zstd.workspace = true
hex.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
